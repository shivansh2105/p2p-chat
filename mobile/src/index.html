<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>P2P Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1>P2P Chat</h1>
      <div class="connection-status" id="connectionStatus">
        <span class="status-dot offline"></span>
        <span id="peerCount">0 peers</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Setup Screen -->
      <div id="setupScreen" class="screen active">
        <div class="setup-card">
          <h2>Welcome to P2P Chat</h2>
          <p>Decentralized • Encrypted • Serverless</p>
          
          <div class="input-group">
            <label for="usernameInput">Your Name</label>
            <input type="text" id="usernameInput" placeholder="Enter your name" maxlength="50">
          </div>
          
          <button class="btn primary" id="startBtn">Start Chatting</button>
        </div>
      </div>

      <!-- Connection Screen -->
      <div id="connectionScreen" class="screen">
        <div class="tabs">
          <button class="tab active" data-tab="create">Create Invite</button>
          <button class="tab" data-tab="join">Join</button>
        </div>

        <div class="tab-content active" id="createTab">
          <p>Share this code with your friend:</p>
          <div class="code-display" id="offerCode">
            <button class="btn secondary" id="generateCodeBtn">Generate Invite Code</button>
          </div>
          <div id="waitingForAnswer" style="display:none;">
            <p>Waiting for friend's response...</p>
            <div class="input-group">
              <label>Paste friend's response code:</label>
              <textarea id="answerInput" rows="3" placeholder="Paste answer code here"></textarea>
            </div>
            <button class="btn primary" id="completeConnectionBtn">Connect</button>
          </div>
        </div>

        <div class="tab-content" id="joinTab">
          <div class="input-group">
            <label>Paste invite code from friend:</label>
            <textarea id="offerInput" rows="3" placeholder="Paste invite code here"></textarea>
          </div>
          <button class="btn primary" id="acceptOfferBtn">Accept Invite</button>
          <div id="myAnswerCode" style="display:none;">
            <p>Send this code back to your friend:</p>
            <div class="code-display" id="answerCode"></div>
            <button class="btn secondary" id="copyAnswerBtn">Copy Code</button>
          </div>
        </div>

        <div class="connected-peers" id="connectedPeers" style="display:none;">
          <h3>Connected Peers</h3>
          <ul id="peerList"></ul>
        </div>

        <button class="btn secondary" id="goToChatBtn" style="display:none;">Go to Chat</button>
      </div>

      <!-- Chat Screen -->
      <div id="chatScreen" class="screen">
        <div class="messages" id="messages"></div>
        
        <div class="message-input">
          <input type="text" id="messageInput" placeholder="Type a message...">
          <button class="btn primary send-btn" id="sendBtn">Send</button>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav" style="display:none;">
      <button class="nav-item" data-screen="connectionScreen">
        <span class="nav-icon">👥</span>
        <span>Connect</span>
      </button>
      <button class="nav-item active" data-screen="chatScreen">
        <span class="nav-icon">💬</span>
        <span>Chat</span>
      </button>
    </nav>
  </div>

  <script type="module">
    import p2pChat from './app.js';

    let currentScreen = 'setupScreen';

    // Initialize
    async function init() {
      await p2pChat.init();
      
      // Setup event handlers
      p2pChat.onMessage = (msg) => {
        addMessageToUI(msg);
      };

      p2pChat.onPeerConnected = (peerId, username) => {
        updatePeerList();
        showNotification(`${username} connected!`);
      };

      p2pChat.onPeerDisconnected = (peerId) => {
        updatePeerList();
      };

      // Load existing messages
      p2pChat.messages.forEach(msg => addMessageToUI(msg));

      // Check if username already set
      if (p2pChat.username && p2pChat.username !== 'Anonymous') {
        document.getElementById('usernameInput').value = p2pChat.username;
      }

      setupEventListeners();
    }

    function setupEventListeners() {
      // Start button
      document.getElementById('startBtn').onclick = async () => {
        const username = document.getElementById('usernameInput').value.trim();
        if (!username) {
          alert('Please enter your name');
          return;
        }
        await p2pChat.setUsername(username);
        showScreen('connectionScreen');
        document.getElementById('bottomNav').style.display = 'flex';
      };

      // Tabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.onclick = () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
        };
      });

      // Generate invite code
      document.getElementById('generateCodeBtn').onclick = async () => {
        const code = await p2pChat.createConnectionOffer();
        document.getElementById('offerCode').innerHTML = `
          <textarea readonly rows="4">${code}</textarea>
          <button class="btn secondary" onclick="navigator.clipboard.writeText('${code}')">Copy</button>
        `;
        document.getElementById('waitingForAnswer').style.display = 'block';
      };

      // Complete connection with answer
      document.getElementById('completeConnectionBtn').onclick = async () => {
        const answer = document.getElementById('answerInput').value.trim();
        if (!answer) return;
        try {
          await p2pChat.completeConnection(answer);
          showNotification('Connected!');
          updatePeerList();
          document.getElementById('goToChatBtn').style.display = 'block';
        } catch (e) {
          alert('Invalid code: ' + e.message);
        }
      };

      // Accept offer
      document.getElementById('acceptOfferBtn').onclick = async () => {
        const offer = document.getElementById('offerInput').value.trim();
        if (!offer) return;
        try {
          const answerCode = await p2pChat.acceptConnectionOffer(offer);
          document.getElementById('answerCode').innerHTML = `
            <textarea readonly rows="4">${answerCode}</textarea>
          `;
          document.getElementById('myAnswerCode').style.display = 'block';
          document.getElementById('copyAnswerBtn').onclick = () => {
            navigator.clipboard.writeText(answerCode);
            showNotification('Copied!');
          };
          updatePeerList();
          document.getElementById('goToChatBtn').style.display = 'block';
        } catch (e) {
          alert('Invalid code: ' + e.message);
        }
      };

      // Go to chat
      document.getElementById('goToChatBtn').onclick = () => {
        showScreen('chatScreen');
      };

      // Send message
      document.getElementById('sendBtn').onclick = sendMessage;
      document.getElementById('messageInput').onkeypress = (e) => {
        if (e.key === 'Enter') sendMessage();
      };

      // Bottom nav
      document.querySelectorAll('.nav-item').forEach(item => {
        item.onclick = () => {
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          showScreen(item.dataset.screen);
        };
      });
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      if (!content) return;

      try {
        const msg = await p2pChat.sendMessage(content);
        addMessageToUI(msg);
        input.value = '';
      } catch (e) {
        alert('Failed to send: ' + e.message);
      }
    }

    function addMessageToUI(msg) {
      const container = document.getElementById('messages');
      const isOwn = msg.from === p2pChat.peerId;
      
      const div = document.createElement('div');
      div.className = `message ${isOwn ? 'own' : 'other'}`;
      div.innerHTML = `
        <div class="message-header">
          <span class="username">${escapeHtml(msg.fromUsername || 'Unknown')}</span>
          <span class="time">${new Date(msg.timestamp).toLocaleTimeString()}</span>
        </div>
        <div class="message-content">${escapeHtml(msg.content)}</div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function updatePeerList() {
      const peers = p2pChat.getConnectedPeers();
      const count = peers.length;
      
      document.getElementById('peerCount').textContent = `${count} peer${count !== 1 ? 's' : ''}`;
      document.querySelector('.status-dot').className = `status-dot ${count > 0 ? 'online' : 'offline'}`;
      
      const list = document.getElementById('peerList');
      list.innerHTML = peers.map(p => `<li>${escapeHtml(p.username)}</li>`).join('');
      
      document.getElementById('connectedPeers').style.display = count > 0 ? 'block' : 'none';
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      currentScreen = screenId;
    }

    function showNotification(text) {
      // Simple toast notification
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = text;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
